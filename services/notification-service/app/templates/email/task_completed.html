<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Completed</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .wrapper { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { background: #065f46; padding: 32px; text-align: center; }
    .header h1 { color: #6ee7b7; margin: 0; font-size: 22px; }
    .body { padding: 36px 40px; }
    .task-card { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 20px; margin: 20px 0; }
    .task-card .value { font-size: 16px; font-weight: 600; color: #065f46; }
    .footer { background: #f9fafb; padding: 20px 40px; text-align: center; border-top: 1px solid #e5e7eb; }
    .footer p { font-size: 12px; color: #9ca3af; margin: 0; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>🎉 Task Complete!</h1>
    </div>
    <div class="body">
      <h2 style="color:#111827;">Well done, {{ username }}!</h2>
      <p style="color:#4b5563; font-size:15px;">You've successfully completed a task:</p>
      <div class="task-card">
        <div style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#6b7280; margin-bottom:6px;">Completed Task</div>
        <div class="value">✓ {{ task_title }}</div>
      </div>
      <p style="color:#6b7280; font-size:13px;">Keep up the great work. Head back to TaskForge to see what's next.</p>
    </div>
    <div class="footer">
      <p>© 2025 TaskForge. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
